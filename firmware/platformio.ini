; Konfigurasi PlatformIO untuk ESP32 (Type-C) + DHT22
; Jika board kamu menggunakan chip ESP32-C3 atau ESP32-S3, sesuaikan baris `board = ...`

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
